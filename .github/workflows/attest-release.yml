name: Attest release assets

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to attest, for example v1.1.1
        required: true
        default: v1.1.1

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Attest plugin release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
